<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тестовая страница Натальи</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #fff8ef;
      color: #2b2b2b;
    }
    .card {
      width: min(680px, 88vw);
      background: #ffffff;
      border: 3px solid #f1c27d;
      border-radius: 28px;
      padding: 36px;
      box-shadow: 0 14px 35px rgba(0,0,0,.12);
      text-align: center;
    }
    h1 { font-size: 34px; margin: 0 0 16px; }
    p { font-size: 20px; line-height: 1.5; margin: 10px 0; }
    .clip { font-size: 52px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="clip">📎</div>
    <h1>Страница опубликована!</h1>
    <p>Это тестовая HTML-страница из ChatGPT.</p>
    <p>Если вы видите этот экран по ссылке GitHub Pages — значит, дальше я смогу выкладывать сюда интерактивные задания.</p>
  </main>
</body>
</html>
