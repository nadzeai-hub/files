const LESSON={"author": "Паводле Леаніда Улашчанкі", "parts": ["Была нядзеля. Гаспадыня накрыла святочны стол. Чаго толькі на ім не было: і грэцкая каша, і салата, і смажанае мяса, і нават фаршыраваны шчупак. Усе стравы атрымаліся вельмі смачныя. Але не паспела гаспадыня выйсці, як яны заспрачаліся паміж сабою, якая з іх самая галоўная. Кожная была ўпэўнена, што яна найважнейшая.", "Як тут быць? «А давайце дамовімся, — прапанавалі раптам агуркі, — каго першага людзі возьмуць у рукі, той і галоўны». На тым і пагадзіліся.", "Гаспадыня запрасіла гасцей да стала. Калі ўсе паселі, самы стары і паважаны дзед агледзеў стол і запытаўся, ці ў кожнага ўсё ёсць. Потым яшчэ раз зірнуў на стол і хітравата ўсміхнуўся:\n— Гаспадынька, а нешта ж я не бачу на стале самага галоўнага.\n— Чаго? — падхапілася гаспадыня.\n— Паглядзі, сама ўбачыш…", "Жанчына акінула ўважлівым вокам стол і пляснула далонямі:\n— Гэта ж трэба — хлеб не падала! Так закруцілася, што пра самае галоўнае забылася.\nЛюдзі за сталом заўсміхаліся, павесялелі, а гаспадыня прынесла вялікі бохан свежага духмянага хлеба і падала дзеду. Той узяў нож і пачаў лусту за лустай кроіць яго. Рукі гасцей самі сабой пацягнуліся да хлеба."], "vocab": [["гаспадыня", "хозяйка, которая приготовила еду и встречает гостей", "person"], ["стравы", "блюда: каша, салат, мясо", "table"], ["грэцкая каша", "гречневая каша", "bowl"], ["фаршыраваны шчупак", "щука, приготовленная с начинкой", "fish"], ["заспрачаліся", "начали спорить", "talk"], ["дамовімся", "договоримся", "talk"], ["пагадзіліся", "согласились", "check"], ["найважнейшая", "самая важная, главная", "star"], ["хітравата ўсміхнуўся", "улыбнулся с хитринкой: что-то заметил или задумал", "eye"], ["акінула вокам", "оглядела", "eye"], ["пляснула далонямі", "хлопнула в ладоши", "clap"], ["закруцілася", "захлопоталась, была занята многими делами", "person"], ["бохан", "целый хлеб, буханка", "bread"], ["луста, скіба", "ломоть, отрезанный кусок хлеба", "slice"], ["акраец", "краюшка, горбушка хлеба", "edge"], ["скарынка", "наружная корочка хлеба", "crust"], ["паважаны", "уважаемый", "grandpa"], ["падхапілася", "быстро встала, вскочила", "person"], ["духмяны", "ароматный, приятно пахнущий", "bread"], ["кроіць", "резать на ломти", "slice"], ["раптам", "вдруг, неожиданно", "star"], ["зірнуў", "взглянул", "eye"], ["далоні", "ладони", "clap"], ["пацягнуліся", "потянулись", "bread"]], "vocabQ": [{"prompt": "Што называюць стравамі?", "options": ["Талеркі і лыжкі.", "Прыгатаваную ежу: кашу, салату, мяса.", "Людзей за сталом."], "answer": 1, "why": "Стравы — гэта прыгатаваная ежа."}, {"prompt": "Гаспадыня «закруцілася». Што гэта значыць?", "options": ["Доўга круцілася на адным месцы.", "Была занята многімі справамі.", "Пайшла танцаваць."], "answer": 1, "why": "Яна захлапаталася і таму забылася падаць хлеб."}, {"prompt": "Што такое бохан?", "options": ["Цэлы хлеб.", "Адна тонкая луста.", "Толькі скарынка."], "answer": 0, "why": "Бохан — цэлы хлеб. Ад яго адразаюць лусты."}, {"prompt": "Жанчына «акінула вокам стол». Яна…", "options": ["заплюшчыла вочы.", "паклала нешта на стол.", "уважліва агледзела стол."], "answer": 2, "why": "Гэты выраз азначае «агледзела»; яго не трэба разумець літаральна."}], "readQ": [{"prompt": "Хто заспрачаўся? Каго абазначае слова «яны»?", "options": ["Гаспадыня і дзед.", "Стравы на стале.", "Госці."], "answer": 1, "why": "Слова «яны» абазначае стравы. Аўтар ажыўляе іх: яны спрачаюцца, як людзі.", "oral": "Знайдзі сказ, які паказвае, што кожная страва лічыла сябе галоўнай."}, {"prompt": "Якую дамову прапанавалі агуркі?", "options": ["Галоўны той, каго першым возьмуць у рукі.", "Галоўны той, хто гучней крычыць.", "Галоўны той, хто стаіць бліжэй да дзеда."], "answer": 0, "why": "Стравы вырашылі паглядзець на выбар людзей.", "oral": "Перакажы дамову сваімі словамі. Ці ўжо вядомы вынік?"}, {"prompt": "Што прапанаваў дзед гаспадыні?", "options": ["Прыгатаваць яшчэ адну страву.", "Самой паглядзець і заўважыць, чаго не хапае.", "Прыбраць ежу са function map(){app.innerHTML=`<section class="hero"><div><div class="eyebrow">БЕЛАРУСКАЕ ЧЫТАННЕ · 2 КЛАС</div><h1>Сакрэт<br>святочнага стала</h1><p class="lead">Чаму хлеб апынуўся самым галоўным? Прачытай гісторыю, збяры доказы і растлумач свой вывад.</p><div class="tags"><span class="tag">Словы і сэнсы</span><span class="tag">Чытанне з прыпынкамі</span><span class="tag">Пераказ</span></div><button class="primary" id="start">${state.started?'Працягнуць урок →':'Пачаць даследаванне →'}</button>${state.started?'<button class="quiet" id="reset" style="margin-left:12px">Спачатку</button>':''}<p class="note" style="margin-top:23px">Па творы «Хлеб». ${LESSON.author}.<br>Чытаем, адказваем і знаходзім словы-доказы.</p></div><div class="cover"><span class="coverlabel">САКРЭТ ЗА ЗВЫЧАЙНЫМ СТАЛОМ</span>${cover()}<div class="ornament"></div></div></section><section class="modulecards">${MODS.map((m,n)=>`<button class="modulecard ${stageDone(n)?'done':''}" data-module="${n}"><span class="num">${stageDone(n)?'✓':n+1}</span><b>${m[0]}</b><small>${m[1]}</small></button>`).join('')}</section><p class="footnote">Можна працаваць разам з педагогам або дарослым. Захаванне прагрэсу — у гэтым браузеры.</p>`;$('#start').onclick=()=>{state.started=true;save();openModule(state.stage,state.index)};if($('#reset'))$('#reset').onclick=resetModal;bindModules()}

function bindActions(check){$('#check').onclick=()=>solved?next():check();$('#back').onclick=()=>{if(state.index>0)openModule(state.stage,state.index-1);else if(state.stage>0)openModule(state.stage-1,0);else map()};$('#map').onclick=map;$('#help').onclick=()=>{let msg=state.stage===0?'Патлумач слова простымі словамі або пакажы яго на малюнку.':state.stage===4?'Знайдзі пачатак спрэчкі. Потым успомні дамову, словы дзеда і канцоўку.':state.stage===5?'Вывад павінен абапірацца на тое, што адбылося ў канцоўцы.':'Адкрый «Тэкст» і знайдзі сказ, які дапамагае адказаць.';$('#feedback').innerHTML=`<div class="feedback hint">${msg}</div>`}}
function next(){const n=state.stage;if(n===4){openModule(5,0);return}const len=questions(n).length;if(state.index<len-1)openModule(n,state.index+1);else openModule(n+1,0)}
function renderOrder(){state.index=0;solved=state.done.includes('4_0');let mix=[3,0,4,1,2];frame(`<div class="modulehead"><span class="crumb">КРОК 5 / 7 · ПАРАДАК ПАДЗЕЙ</span></div><article class="panel"><div class="panelhead"><span class="sub">ЗБЯРЫ ГІСТОРЫЮ</span><h2>Што было спачатку?</h2></div><div class="question"><div class="prompt">Націскай карткі па парадку або перацягвай іх у светлае поле. Каб вярнуць картку, націсні на яе ўнізе.</div><div class="eventbank">${mix.map(j=>`<button class="eventcard" draggable="true" data-event="${j}"><span class="num">◇</span>${esc(LESSON.events[j])}</button>`).join('')}</div><div class="orderlist" id="orderlist" aria-label="Твой парадак падзей"><span class="note">Пачні з падзеі, якая адбылася раней за астатнія.</span></div><div id="feedback" role="status" aria-live="polite">${solved?'<div class="feedback good">✓ Парадак ужо адноўлены.</div>':''}</div></div>${actions()}</article>`);
function redraw(){document.querySelectorAll('[data-event]').forEach(b=>b.disabled=solved||sequence.includes(+b.dataset.event));$('#orderlist').innerHTML=sequence.length?sequence.map((j,k)=>`<button class="eventchosen" data-remove="${k}"><strong>${k+1}</strong><span>${esc(LESSON.events[j])}</span></button>`).join(''):'<span class="note">Выберы першую падзею.</span>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(solved)return;sequence.splice(+b.dataset.remove,1);redraw()})}
function add(j){if(solved||sequence.includes(j))return;sequence.push(j);redraw()}
document.querySelectorAll('[data-event]').forEach(b=>{b.onclick=()=>add(+b.dataset.event);b.ondragstart=e=>{if(solved){e.preventDefault();return}e.dataTransfer.setData('text/plain',b.dataset.event)}});$('#orderlist').ondragover=e=>e.preventDefault();$('#orderlist').ondrop=e=>{e.preventDefault();const n=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(n)&&n>=0&&n<5)add(n)};
bindActions(()=>{if(sequence.length<5)return feedback('Выберы ўсе пяць падзей.');if(sequence.every((v,j)=>v===j)){complete();redraw();$('#feedback').innerHTML='<div class="feedback good">✓ Гісторыя адноўлена. Спрэчка → дамова → заўвага дзеда → хлеб → паводзіны гасцей.</div>'}else feedback('Правер прычыну і вынік: ці маглі госці пацягнуцца да хлеба раней, чым яго прынеслі?')});if(solved){sequence=[0,1,2,3,4];redraw()}}
function renderRetell(){frame(`<div class="modulehead"><span class="crumb">КРОК 7 / 7 · ТВОЙ ПЕРАКАЗ</span></div><article class="panel"><div class="panelhead"><span class="sub">СВАІМІ СЛОВАМІ</span><h2>Раскажы гісторыю таму, хто яе не чытаў</h2><p class="note">Карыстайся малюнкамі. Растлумач, як падзеі звязаны паміж сабой.</p></div><div class="question"><div class="retellgrid">${[['table','Стол','Хто накрыў стол? Што на ім было?'],['talk','Спрэчка','Пра што спрачаліся? Пра што дамовіліся?'],['grandpa','Заўвага дзеда','Што ён заўважыў? Чаму хлеба не было?'],['bread','Канцоўка','Што зрабілі госці? Што гэта паказала?']].map(x=>`<div class="retellcard">${art(x[0])}<h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div><div class="oral"><b>Завяршы вывад:</b>Хлеб важны для людзей. У апавяданні гэта відаць, калі…</div><div class="checks"><label class="checkrow"><input type="checkbox" id="r0">Я расказаў падзеі ў правільным парадку.</label><label class="checkrow"><input type="checkbox" id="r1">Я растлумачыў, чаму героі так зрабілі.</label><label class="checkrow"><input type="checkbox" id="r2">Я знайшоў у тэксце доказ свайго вываду.</label></div><p class="note">Абмяркуй гэтыя пункты з педагогам або дарослым і адзнач, што атрымалася.</p><div id="feedback" role="status" aria-live="polite"></div></div><footer class="actions"><button class="quiet" id="retelltext">Адкрыць тэкст</button><button class="primary" id="finish">Завяршыць даследаванне</button></footer></article>`);$('#retelltext').onclick=showText;$('#finish').onclick=()=>{if(![0,1,2].every(i=>$('#r'+i).checked))return feedback('Перакажы гісторыю і абмяркуй усе тры пункты. Потым адзнач іх.');state.finished=true;save();victory()}}
function victory(){app.innerHTML=`<section class="victory"><div class="eyebrow">ДАСЛЕДАВАННЕ ЗАВЕРШАНА</div>${art('bread')}<h1>Ты прачытаў.<br>І растлумачыў сэнс.</h1><p>Ты прасачыў падзеі, знайшоў прычыны і падмацаваў вывад словамі з тэксту.</p><div class="tags" style="justify-content:center"><span class="tag">Разумею словы</span><span class="tag">Знаходжу доказ</span><span class="tag">Пераказваю</span></div><button class="primary" id="victorymap">Вярнуцца да маршруту</button></section>`;$('#victorymap').onclick=map;}
function modal(content,label='Даведка'){const focus=document.activeElement;window.modalFocus=focus;$('#overlay').innerHTML=`<div class="modalbg"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="modalhead"><span class="eyebrow">ЧЫТАЕМ І РАЗУМЕЕМ</span><button class="quiet" id="close" aria-label="Закрыць">✕</button></div>${content}</section></div>`;$('#close').onclick=closeModal;$('#close').focus()}function closeModal(){$('#overlay').innerHTML='';window.modalFocus?.focus?.()}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#close'))closeModal()});
function dict(){modal(`<h2>Слоўнік да апавядання</h2><p class="note">Спачатку паспрабуй зразумець слова па сказе. Потым правер сябе.</p>${LESSON.vocab.map(v=>`<div class="dictrow"><b>${v[0]}</b><span lang="ru">${v[1]}</span></div>`).join('')}`,'Слоўнік')}
function showText(){modal(`<h2>Хлеб</h2><p class="note">${LESSON.author}.</p><div class="booktext">${LESSON.parts.map(p=>'<p>'+esc(p)+'</p>').join('')}</div>`,'Тэкст апавядання')}
function teacher(){modal(`<h2>Урок «Сакрэт святочнага стала»</h2><p><b>Цель:</b> ребёнок восстанавливает события, объясняет причины и подтверждает вывод о хлебе конкретным эпизодом. Ориентир — 45–50 минут.</p><table><tr><th>Этап</th><th>Время</th><th>Действие педагога</th></tr><tr><td>Предположение по названию</td><td>3 мин</td><td>Спросить, о чём может быть рассказ. Ответ запомнить и проверить в конце.</td></tr><tr><td>Словарь</td><td>7 мин</td><td>Выбрать незнакомые слова. Попросить объяснить или показать значение.</td></tr><tr><td>Чтение с остановками</td><td>12–15 мин</td><td>После каждого ответа ребёнок выполняет устный вопрос и показывает доказательство.</td></tr><tr><td>Факты и причины</td><td>8 мин</td><td>Исправить ложные утверждения. Найти в тексте причину поступка.</td></tr><tr><td>Порядок и главная мысль</td><td>7 мин</td><td>Связать события. Различить общий вывод и конкретный сказ-доказ.</td></tr><tr><td>Пересказ и рабочий лист</td><td>8–10 мин</td><td>Пересказ по четырём картинкам. Для записи выбрать задания листа или дать его после урока.</td></tr></table><p>Если ребёнок затрудняется ответить по-белорусски, сначала принимаем содержательное объяснение по-русски, затем вместе строим короткую белорусскую фразу. Кнопки проверяют выбор; понимание подтверждается устным объяснением и работой с текстом.</p><details><summary>Три критических места в понимании</summary><p>1. «Яны» — блюда, а не гости. Автор оживляет блюда.<br>2. Хозяйка забыла хлеб из-за хлопот; отрицательное отношение к хлебу в тексте не описано.<br>3. Важность хлеба показана через замечание деда и действия гостей. Не требуем утверждать, будто хлеб сам спорил или называл себя главным.</p></details><details><summary>Все ответы</summary><p><b>Словарь:</b> приготовленная еда; занята делами; целый хлеб; оглядела.<br><b>Чтение:</b> блюда; кого первым возьмут в руки; самой посмотреть; потянулись к хлебу.<br><b>Факты:</b> подмена, факт, подмена, факт, подмена.<br><b>Причины:</b> каждая считала себя главной; разрешить спор; захлопоталась и забыла.<br><b>Порядок:</b> спор → договор → замечание деда → хозяйка принесла хлеб → гости потянулись.<br><b>Вывод:</b> хлеб важен; доказательство — последнее предложение.</p></details><details><summary>Как понять, что чтение осмысленное</summary><p>Ребёнок называет участников спора, пересказывает договор своими словами, объясняет отсутствие хлеба, восстанавливает порядок и связывает концовку с выводом. Если он только произносит «Хлеб — галоўны», попросите: «Якая падзея дапамагла табе гэта зразумець?»</p></details><details><summary>Источник и работа с доской</summary><p>«Хлеб», ${LESSON.author}, учебная адаптация на предоставленном фото, с. 54–55. Имя автора уточнено по увеличенному снимку. Текст воспроизведён с нормализацией переносов строк. Визуальные листы загружайте на доску по одному, свободные поля заполняйте вместе с ребёнком. Интерактив открывайте по ссылке и показывайте через демонстрацию экрана. Прогресс автоматически сохраняется в этом браузере. Модули доступны свободно: можно вернуться к нужному этапу.</p></details><button class="quiet" id="teacherreset" style="margin-top:15px">Начать этот урок заново</button>`,'Панель педагога');$('#teacherreset').onclick=resetModal}
function resetModal(){modal('<h2>Пачаць урок спачатку?</h2><p>Прагрэс гэтага ўрока ў гэтым браузеры будзе ачышчаны.</p><button class="primary" id="confirmreset">Пачаць спачатку</button>');$('#confirmreset').onclick=()=>{state={started:false,stage:0,index:0,done:[],flipped:[],vocabReady:false,finished:false};save();closeModal();map()}}
$('#brandart').innerHTML=art('bread');$('#home').onclick=map;$('#dictionary').onclick=dict;$('#text').onclick=showText;$('#teacher').onclick=teacher;$('#full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});else document.documentElement.requestFullscreen?.().catch(()=>{})};window.addEventListener('pagehide',save);map();
</script></body></html>
