<title>Згублены скарб Беларусі — сцэна 1</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#34291d;background:#efe4cc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff4d9,#e5d0a8);min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #298db1;outline-offset:3px}.shell{max-width:1130px;margin:auto;padding:16px}.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:#fffaedec;padding:12px 18px;border:1px solid #bba47a;border-radius:20px;box-shadow:0 5px 20px #78592723}.brand{font-weight:900;color:#654723}.small{font-size:13px;color:#6d5c46}.tools{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#fff8e6;border:1px solid #b8a780;border-radius:30px;padding:9px 12px}.stage{min-height:530px;position:relative;margin:16px 0;border:9px solid #805b37;border-radius:24px;overflow:hidden;background:linear-gradient(0deg,#76553e 0 23%,transparent 23%),repeating-linear-gradient(90deg,#b58b5f 0 4px,#c9a678 4px 180px,#9d784f 183px 187px),linear-gradient(135deg,#b9d2bb,#e8d4ae);box-shadow:0 14px 33px #55381945}.stage:before{content:"";position:absolute;inset:45px 3% 28%;border:14px solid #7c5b3a;border-radius:8px;background:repeating-linear-gradient(90deg,#64452d 0 9px,#c69c6a 10px 14px,#694b35 16px 21px,#dab78c 22px 27px);opacity:.32;pointer-events:none}.lamp{position:absolute;top:10px;right:15%;font-size:56px;filter:drop-shadow(0 0 22px #ffdf8e)}.scene{position:relative;z-index:1;min-height:505px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;gap:18px}.paper{max-width:670px;width:100%;background:#fffae9;border:2px solid #b89863;border-radius:15px;box-shadow:3px 6px 0 #70503344;padding:22px;text-align:center}.paper h1{font-family:Georgia,serif;font-size:clamp(27px,5vw,46px);margin:10px 0;color:#603d22}.paper h2{font-family:Georgia,serif;font-size:clamp(23px,4vw,34px);margin:4px 0 15px}.paper p{font-size:clamp(17px,2vw,21px);line-height:1.5;margin:10px 0}.primary{background:#236b6f;color:#fff;border:2px solid #15585b;border-radius:15px;padding:12px 23px;font-weight:800;min-height:48px;box-shadow:0 4px 0 #164b4e}.primary:hover{background:#307f82}.sub{background:#fdf8e8;color:#4b3c25;border:2px solid #a08c61;border-radius:13px;padding:10px 15px;font-weight:700}.speech{display:flex;align-items:flex-start;gap:16px;max-width:740px;background:#fffaf1;border:2px solid #9ac4cf;border-radius:18px;padding:15px;box-shadow:0 5px 16px #463a2830}.speech p{font-size:18px;line-height:1.45;white-space:pre-line;margin:3px 0}.portrait{min-width:100px;width:100px;height:110px;border:2px dashed #6cabc3;border-radius:14px;background:#e5f5f7;display:grid;place-items:center;text-align:center;font-size:13px;color:#346577;padding:8px}.chest{width:210px;height:135px;margin:auto;position:relative;cursor:pointer;transition:transform .25s}.chest:hover{transform:translateY(-4px)}.lid{height:51px;border:8px solid #73401f;border-radius:70px 70px 10px 10px;background:repeating-linear-gradient(90deg,#aa692e 0 30px,#c88b49 30px 60px);box-shadow:inset 0 6px #ebc37b}.base{height:83px;background:repeating-linear-gradient(90deg,#b4783e 0 33px,#cd9555 33px 66px);border:8px solid #73401f;border-radius:8px 8px 22px 22px;position:relative}.lock{position:absolute;top:7px;left:calc(50% - 13px);background:#e5c05d;border:4px solid #805a22;border-radius:3px;width:26px;height:31px}.note{background:#fbe9b9;border:1px solid #99764d;border-radius:5px;padding:18px 26px;transform:rotate(-3deg);box-shadow:3px 7px 0 #5946294d;font:700 22px Georgia;color:#684525}.pieces{display:grid;gap:10px;width:min(630px,100%)}.piece{border:2px dashed #a58255;border-radius:8px;background:#ffe7af;padding:15px;font-size:19px;text-align:left}.piece.sel{background:#b1e5e2;border-color:#157477}.choices{display:grid;gap:10px;width:min(660px,100%)}.choice{padding:14px;background:#fffaf0;border:2px solid #c5a676;border-radius:12px;text-align:left;font-size:18px}.choice:hover,.choice:focus{border-color:#267b87;background:#e8f7f6}.feedback{background:#eaf6eb;border:2px solid #81a38e;border-radius:12px;padding:14px;max-width:630px;font-size:18px}.footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;color:#6c5739;font-size:14px}.modal{position:fixed;inset:0;background:#20180ec0;z-index:9;display:grid;place-items:center;padding:18px}.modal article{background:#fff7e4;border:5px solid #8e663d;border-radius:19px;max-width:480px;width:100%;padding:25px;text-align:center}.hide{display:none!important}.sound{border:0;background:transparent;color:#226776;text-decoration:underline;padding:5px;font-weight:bold}.counter{font-weight:bold;color:#155f64}.fade{animation:fade .36s ease}@keyframes fade{from{opacity:.25;transform:translateY(7px)}to{opacity:1;transform:none}}@media(max-width:600px){.shell{padding:7px}.stage{border-width:5px}.scene{padding:13px}.paper{padding:16px}.speech{flex-direction:column;gap:5px}.portrait{min-height:65px;height:65px;width:100%;min-width:0}.lamp{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="shell"><header class="top"><div><div class="brand">✦ Згублены скарб Беларусі</div><div class="small">Расследаванне 1 · Прататып сцэны 1</div></div><div class="tools"><button class="chip" id="audio">🔊 Слухаць і чытаць</button><button class="chip" id="chest">🧰 Мой куфэрак <span class="counter" id="count">0</span></button><button class="chip" id="help">💡 Падказка</button></div></header><section class="stage"><div class="lamp" aria-hidden="true">💡</div><div id="app" class="scene" aria-live="polite"></div></section><footer class="footer"><span id="step">Пачатак расследавання</span><div><button class="sub" id="back">← Назад</button> <button class="sub" id="reset">Пачаць нанова</button></div></footer></main><div id="modal" class="modal hide" role="dialog" aria-modal="true"><article><div id="modalText"></div><button class="primary" id="close">Закрыць</button></article></div>
<script>
(()=>{'use strict';
const key='skarbb-v1-scene1',initial={step:0,pieces:[],hypothesis:null,treasure:[],audio:true},load=()=>{try{return {...initial,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{return {...initial}}};let s=load();const $=id=>document.getElementById(id),app=$('app');const store=()=>{try{localStorage.setItem(key,JSON.stringify(s))}catch{}};const safe=(t)=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');let utter=null;function speak(t){if(!s.audio)return;stop();const voices=window.speechSynthesis?.getVoices?.()||[];const be=voices.find(v=>/^be([-_]|$)/i.test(v.lang));if(be){utter=new SpeechSynthesisUtterance(t);utter.lang=be.lang;utter.voice=be;utter.rate=.88;speechSynthesis.speak(utter)}else{console.info('Беларуская TTS-агучка не даступная ў гэтым браўзеры');$('audio').title='Беларускі голас не знойдзены. Патрэбныя аўдыязапісы.'}}function stop(){if('speechSynthesis' in window)speechSynthesis.cancel()}function modal(t){$('modalText').innerHTML=t;$('modal').classList.remove('hide')}function go(n){stop();s.step=n;store();render()}const lines=['Калі ты шукаеш скарб Беларусі,','не шукай толькі тое, што можна трымаць у руках.','Скарб можа хавацца ў словах, знаках і памяці.'];const full=lines.join(' ')+' Ці можна пакласці Радзіму ў куфэрак?';
const speech=(t)=>'<div class="speech"><div class="portrait" aria-label="Месца для зацверджанага малюнка Васількі">Васілька<br>арыгінальны малюнак будзе дададзены</div><div><strong>Васілька</strong><p>'+safe(t)+'</p><button class="sound" data-say="'+encodeURIComponent(t)+'">🔊 Паслухаць Васільку</button></div></div>';
const panel=(h,p)=>'<div class="paper"><h2>'+h+'</h2><p>'+p+'</p></div>';
function render(){const k=s.step;$('count').textContent=s.treasure.length;$('audio').textContent=s.audio?'🔊 Слухаць і чытаць':'🔇 Гук выключаны';$('step').textContent='Сцэна 1 · крок '+(k+1)+' з 7';$('back').disabled=k===0;let out='';
if(k===0){out='<div class="paper fade"><div style="font-size:40px">🗝️ ✧ 📜</div><div class="small">РАССЛЕДАВАННЕ № 1</div><h1>Ці можна пакласці Радзіму ў куфэрак?</h1><p>У архіве знойдзены пусты куфэрак. Але ці сапраўды ён пусты?</p><button class="primary" data-go="1">Увайсці ў архіў →</button></div>'}
if(k===1){out=panel('Таямнічы архіў','Паліцы з кнігамі, папкамі і старымі карткамі. На стале — невялікі куфэрак. Што ён тут робіць?')+'<button class="primary" data-go="2">Агледзецца →</button>'}
if(k===2){out=speech('Прывітанне! Я Васілька. Я люблю знаходзіць тайны ў звычайных рэчах. Дапаможаш мне разабрацца з адной загадкай?')+'<button class="primary" data-go="3">Дапамагу! →</button>'}
if(k===3){out=speech('Глядзі! На стале куфэрак. Здаецца, у ім ёсць запіска. Націсні на куфэрак!')+'<button class="chest" id="openchest" aria-label="Адкрыць куфэрак"><div class="lid"></div><div class="base"><div class="lock"></div></div></button><div class="small">Націсні на куфэрак</div>'}
if(k===4){const reversed=[2,0,1];out=speech('Запіска парвалася! Націскай на яе часткі ў правільным парадку, каб аднавіць паведамленне.')+'<div class="paper"><h2>📜 Збяры запіску</h2><p>Абяры спачатку пачатак, потым працяг і канец.</p><div class="pieces">'+reversed.map(i=>'<button class="piece '+(s.pieces.includes(i)?'sel':'')+'" data-piece="'+i+'" '+(s.pieces.includes(i)?'disabled':'')+'>'+safe(lines[i])+'</button>').join('')+'</div><p class="small">Сабрана: '+s.pieces.length+' з 3</p></div>'}
if(k===5){out='<div class="paper"><h2>📜 Таямнічая запіска</h2><p>'+safe(full)+'</p><button class="sound" data-say="'+encodeURIComponent(full)+'">🔊 Праслухаць запіску</button></div>'+speech('Цікава! Значыць, трэба праверыць розныя здагадкі. Якую версію прапануеш ты?')+'<div class="choices">'+['Толькі золата і каштоўныя рэчы','Тое, што важна для Беларусі','Толькі вельмі старыя прадметы','Тое, што чалавек сам лічыць важным'].map((v,i)=>'<button class="choice" data-choice="'+i+'">'+safe(v)+'</button>').join('')+'</div>'}
if(k===6){const reactions=['Магчыма! Але ці ўсе скарбы павінны быць з золата?','Добрая здагадка! Мы паспрабуем яе праверыць.','Магчыма! Але цікавыя знаходкі бываюць не толькі старымі.','Цікавая думка! У фінале расследавання вернемся да яе.'];out=speech(reactions[s.hypothesis]||'Кожнае расследаванне пачынаецца з пытання.')+'<div class="paper"><h2>Першая знаходка</h2><div class="note">❖ Галоўнае пытанне:<br>Ці можна пакласці Радзіму ў куфэрак?</div><p>Пакладзём гэта пытанне ў наш куфэрак.</p>'+(s.treasure.includes('question')?'<p class="feedback">✓ Знаходка ўжо ў куфэрку!</p><button class="primary" id="next">Да дзесяці знаходак →</button>':'<button class="primary" id="collect">🧰 Пакласці ў куфэрак</button>')+'</div>'}
app.innerHTML=out;app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(decodeURIComponent(b.dataset.say)));const oc=$('openchest');if(oc)oc.onclick=()=>go(4);app.querySelectorAll('[data-piece]').forEach(b=>b.onclick=()=>{const i=+b.dataset.piece;const expect=s.pieces.length;if(i===expect){s.pieces.push(i);store();if(s.pieces.length===3){go(5)}else render()}else modal('<h2>Амаль!</h2><p>Падумай, з якіх слоў пачынаецца запіска.</p>')});app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{s.hypothesis=+b.dataset.choice;go(6)});if($('collect'))$('collect').onclick=()=>{s.treasure=['question'];store();render();};if($('next'))$('next').onclick=()=>modal('<h2>🔎 Наперадзе новыя знаходкі!</h2><p>Ты скончыў першую сцэну. Наступная — «Дзесяць знаходак» — пакуль у распрацоўцы.</p>');}
$('audio').onclick=()=>{s.audio=!s.audio;stop();store();render();if(s.audio){const vs=speechSynthesis?.getVoices?.()||[];if(!vs.some(v=>/^be([-_]|$)/i.test(v.lang)))modal('<h2>Агучка па-беларуску</h2><p>На гэтай прыладзе няма беларускага сінтэзаванага голасу. Кнопкі гатовыя да падключэння запісаных аўдыяфайлаў, але сапраўдная агучка пакуль не дададзена.</p>')}};$('chest').onclick=()=>modal('<h2>🧰 Мой куфэрак</h2><p>'+(s.treasure.length?'✓ Галоўнае пытанне расследавання':'Пакуль пуста. Твае знаходкі з’явяцца тут.')+'</p>');$('help').onclick=()=>modal('<h2>💡 Падказка</h2><p>'+(['Націсні «Увайсці ў архіў».','Націсні «Агледзецца».','Васілька чакае твайго адказу.','Націсні на куфэрак.','Знайдзі частку запіскі, якая пачынаецца са слоў «Калі ты…».','Гэта толькі гіпотэза. Тут можна выбіраць без страху памыліцца.','Пакладзі картку з пытаннем у куфэрак.'][s.step])+'</p>');$('close').onclick=()=>$('modal').classList.add('hide');$('back').onclick=()=>{if(s.step>0)go(s.step-1)};$('reset').onclick=()=>{if(confirm('Скінуць прагрэс першай сцэны?')){s={...initial};stop();store();render()}};window.speechSynthesis?.getVoices?.();render();
})();
</script></body></html>
