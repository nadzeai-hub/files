<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка размеров первого квеста</title><style>body{margin:0;font:16px system-ui;background:#eee}header{padding:12px;position:sticky;top:0;background:white;z-index:2}iframe{display:block;height:1000px;border:1px solid #777;margin:12px}</style><header><label>Ширина экрана <select id="width"><option>375</option><option>430</option><option>768</option><option>1366</option></select></label> <button id="fail">Проверить отказ аудио</button> <button id="play">Проиграть реплику</button> <button id="next">Открыть куфэрак</button> · Техническая проверка</header><iframe title="Квест — проверка размеров" src="index.html?layout-check=20261101b" width="390"></iframe><script>const f=document.querySelector('iframe');function fit(){if(!f.contentDocument)return;const w=+document.querySelector('select').value;f.width=w+(f.contentWindow.innerWidth-f.contentDocument.documentElement.clientWidth)}f.onload=fit;document.querySelector('select').onchange=fit;document.querySelector('#fail').onclick=()=>{f.contentWindow.HTMLMediaElement.prototype.play=function(){return Promise.reject(new Error('Intentional QA audio failure'))};document.querySelector('#fail').textContent='Отказ аудио включён';};document.querySelector('#play').onclick=()=>f.contentDocument.querySelector('.quest-audio-controls button')?.click();document.querySelector('#next').onclick=()=>f.contentDocument.querySelector('#actions button')?.click();</script></html>
