<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка размеров первого квеста</title><style>body{margin:0;font:16px system-ui;background:#eee}header{padding:12px;position:sticky;top:0;background:white;z-index:2}iframe{display:block;height:1000px;border:1px solid #777;margin:12px}</style><header><label>Ширина экрана <select id="width"><option>375</option><option>430</option><option>768</option><option>1366</option></select></label> <button id="fail">Проверить отказ аудио</button> · Техническая проверка</header><iframe title="Квест — проверка размеров" src="index.html" width="375"></iframe><script>const f=document.querySelector('iframe');document.querySelector('select').onchange=e=>f.width=e.target.value;document.querySelector('#fail').onclick=()=>{f.contentWindow.HTMLMediaElement.prototype.play=function(){return Promise.reject(new Error('Intentional QA audio failure'))};document.querySelector('#fail').textContent='Отказ аудио включён';};</script></html>
