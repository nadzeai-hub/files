puzzle">'+order.map(i=>'<button data-piece="'+i+'" '+(state.parts.includes(i)?'disabled':'')+'>'+chunks[i]+'</button>').join('')+'</div><p id="pfeedback" class="result">Сабрана: '+state.parts.length+' з 3</p>');$('modal').querySelectorAll('[data-piece]').forEach(b=>b.onclick=()=>{const i=+b.dataset.piece;if(i!==state.parts.length){$('pfeedback').textContent='Яшчэ не так. Знайдзі пачатак думкі.';return}state.parts.push(i);save();if(state.parts.length===3){$('pfeedback').innerHTML='✓ Запіска адноўлена!<br>Ці можна пакласці Радзіму ў куфэрак?<br><button class="bigbtn" id="next">Да знаходак →</button>';$('next').onclick=()=>{shut();setstage('choose')}}else puzzle()})}function compare(){modal('<h2>Ці ўсё ўмесціцца ў куфэрак?</h2><p>Манету і кнігу можна пакласці ў куфэрак. А цэлае поле валошак? А маміну песню?</p><p class="result">Не ўсё можна трымаць у руках. Але многае можна захаваць у памяці.</p><button class="bigbtn" id="next">Да знаходак →</button>');$('next').onclick=()=>{shut();setstage('choose')}}function render(){const stage=state.stage;$('counter').textContent=state.firstTreasure?1:0;$('cards').innerHTML='';$('cards').classList.toggle('invisible',stage==='chest'||stage==='puzzle');if(stage==='chest'){line('Ці можна пакласці Радзіму ў куфэрак? Адчынім яго і даведаемся!');btn('🧰 Адчыніць куфэрак',chest)}if(stage==='puzzle'){line('Ці можна пакласці Радзіму ў куфэрак? Знайдзі падказку ў запісцы.');btn('📜 Аднавіць запіску',puzzle)}if(stage==='compare'){line('Што ўмесціцца ў куфэрак? Падумай і параўнай знаходкі.');btn('Параўнаць знаходкі →',compare)}if(stage==='choose'||stage==='reason'||stage==='complete'){line(stage==='complete'?'Твая першая знаходка захавана. Да яе мы вернемся ў канцы расследавання.':'Ці можна пакласці Радзіму ў куфэрак? Што ты пакладзеш у яго першым?');for(const c of cardsData){const b=document.createElement('button');b.className='card'+(state.selected===c.id?' selected':'');b.innerHTML='<img src="'+c.src+'" alt="'+c.title+'"><span class="card-title">'+c.title+'</span><span class="radio" aria-hidden="true"></span>';b.onclick=()=>{if(stage==='complete')return;state.selected=c.id;state.reasonVerified=false;save();render()};$('cards').appendChild(b)}if(stage==='complete'){btn('✓ Паглядзець маю знаходку',inventory)}else btn('Пакласці ў куфэрак →',()=>{if(!state.selected){$('speech').textContent='Спачатку абяры адну картку.';return}if(state.level==='advanced'){reasons()}else finish()})}save()}
function reasons(){const c=card(state.selected);const reasonsMap={coin:['Манета можа расказаць пра жыццё людзей у мінулым.','Манета заўсёды чароўная, калі яна блішчыць.','Усе манеты аднолькавыя.'],flower:['Поле валошак нагадвае пра прыроду Беларусі.','Усе кветкі растуць толькі ў Беларусі.','Валошкі зроблены з золата.'],family:['Калыханка захоўвае любоў, словы і сямейныя традыцыі.','Калыханка — гэта прадмет з дрэва.','Калыханкі спяваюць толькі ў музеі.'],book:['Казкі захоўваюць словы і гісторыі.','Усё, што адбываецца ў казках, было насамрэч.','Кнігі патрэбныя толькі для ўпрыгожвання.']};const arr=reasonsMap[state.selected];const order=[1,2,0];modal('<h2>Чаму гэта важна?</h2><img class="miniart" src="'+c.src+'" alt="'+c.title+'"><p>Абяры найбольш дакладнае тлумачэнне.</p>'+order.map(i=>'<button class="reason" data-r="'+i+'">'+arr[i]+'</button>').join('')+'<div id="rfeedback" role="status"></div>');$('modal').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const ok=b.dataset.r==='0';$('modal').querySelectorAll('.reason').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(ok?'correct':'wrong');$('rfeedback').innerHTML='<p class="result">'+(ok?'✓ Правільна!':'Паспрабуй яшчэ. Якое тлумачэнне можна пацвердзіць?')+'</p>'+(ok?'<button class="bigbtn" id="finish">Захаваць знаходку →</button>':'');if(ok){$('finish').onclick=()=>{shut();finish()}}})}function finish(){state.firstTreasure=state.selected;state.stage='complete';save();render();inventory()}
$('inventory').onclick=inventory;$('hint').onclick=()=>modal('<h2>Падказка</h2><p>'+(state.stage==='choose'?'Тут няма аднаго правільнага выбару. Абяры тое, што табе важна.':state.stage==='chest'?'Пачні з куфэрка.':'Успомні, што можа захавацца ў памяці.')+'</p>');$('level').onclick=showLevel;$('reset').onclick=()=>modal('<h2>Пачаць нанова?</h2><p>Твой выбар будзе скінуты.</p><button class="bigbtn" id="confirm">Так, пачаць нанова</button>');$('route1').onclick=()=>{if(state.level)render();else showLevel()};$('close').onclick=shut;$('overlay').onclick=e=>{if(e.target===$('overlay'))shut()};document.addEventListener('keydown',e=>{if(e.key==='Escape')shut()});document.addEventListener('click',e=>{if(e.target.id==='confirm'){state={...initial,level:state.level};save();shut();render()}});if(!state.level)showLevel();render();})();
</script></body></html>
