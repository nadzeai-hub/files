}else if(state.phase===1){html+='<h2>✏️ Построй чертёж</h2><p>Нарисуй два отрезка: для каждого героя свой. Более длинный отрезок должен обозначать большее количество. Отметь разницу, подпиши известные числа и знак вопроса.</p><div class="drawing"><canvas id="draw" width="1000" height="320" aria-label="Поле для рисования чертежа"></canvas><span class="drawingtag">Рисуй здесь</span></div><div class="drawtools"><button class="btn soft" data-action="undo">↶ Отменить штрих</button><button class="btn soft" data-action="clear">Очистить чертёж</button></div><div class="subhead">Чей отрезок должен быть длиннее?</div><div class="pickline">'+t.names.map((n,i)=>'<label class="choice"><input type="radio" name="longer" data-field="drawGreater" value="'+i+'" '+(String(a.drawGreater)===String(i)?'checked':'')+'>'+safe(n)+'</label>').join('')+'</div><p class="note">Игра проверяет выбор длинного отрезка. Сам рисунок ты оцениваешь вместе с учителем.</p>';
}else{html+='<h2>⚡ Обезвредь вычислительную ловушку</h2><p>Посмотри на краткую запись и свой чертёж. Какое действие поможет ответить на вопрос?</p><div class="solvegrid"><div><div class="subhead" style="font-size:.94rem">Выбери знак</div><div class="signs"><label class="sign"><input type="radio" data-field="sign" name="sign" value="+" '+(a.sign==='+'?'checked':'')+'>+</label><label class="sign"><input type="radio" data-field="sign" name="sign" value="−" '+(a.sign==='−'?'checked':'')+'>−</label></div></div><label class="field">Какой ответ получился?<input type="number" data-field="result" min="0" max="999" inputmode="numeric" placeholder="Впиши ответ" value="'+safe(a.result||'')+'"></label></div><div class="story" style="margin:17px 0 8px">Известное число: <b>'+safe(t.given)+'</b>. '+(t.unknown===-1?'Другое количество: <b>'+safe(t.delta)+'</b>.':'Разница: <b>'+safe(t.delta)+'</b>.')+' Найди ответ самостоятельно.</div>'}
html+='<div id="feedback-zone"></div><div class="actions"><button class="btn" data-action="'+(state.phase===0?'checkshort':state.phase===1?'checkdraw':'checksolve')+'">'+(state.phase===0?'Проверить запись →':state.phase===1?'Проверить чертёж →':'Проверить решение ⚡')+'</button><button class="btn alt" data-action="hint">💡 Подсказка</button></div><div id="hint-zone"></div><div class="note"><button class="linkish" data-action="read">🔊 Прочитать задачу</button></div>';main.innerHTML=html;if(state.phase===1)setupDraw(t);bindInputs(t)}
function bindInputs(t){main.querySelectorAll('[data-field]').forEach(el=>{el.addEventListener(el.type==='radio'||el.tagName==='SELECT'?'change':'input',()=>{ans(t)[el.dataset.field]=el.value;save();if(state.phase===0){const a=ans(t);main.querySelectorAll('[data-preview=n1]').forEach(x=>x.textContent=a.n1||'…');main.querySelectorAll('[data-preview=n2]').forEach(x=>x.textContent=a.n2||'…');main.querySelectorAll('[data-preview=greater]').forEach(x=>x.textContent=a.greater!==undefined&&a.greater!==''?t.names[Number(a.greater)]:'…')}const f=$('#feedback-zone');if(f)f.innerHTML=''})})}
function feedback(msg,ok){const x=$('#feedback-zone');if(x){x.innerHTML='<div class="feedback '+(ok?'ok':'')+'">'+safe(msg)+'</div>';x.scrollIntoView({behavior:'smooth',block:'nearest'})}}
function correctShort(){const t=TASKS[state.idx],a=ans(t);if(String(a.n1||'').trim()===''||String(a.n2||'').trim()===''||String(a.greater||'')===''){return feedback('В записи остались пустые места. Заполни их!')}if(Number(a.n1)!==t.given||Number(a.n2)!==t.delta)return feedback('Глитч подменил число! Ещё раз найди оба числа в тексте задачи.');if(Number(a.greater)!==t.greater)return feedback(t.id==='12.2'||t.id==='13.2'?'Ловушка в слове «это»: вернись к предыдущему предложению и проверь, у кого больше.':'Внимательно сравни количества: у кого больше?');state.phase=1;save();render()}
function correctDraw(){const t=TASKS[state.idx],a=ans(t),st=state.ink[t.id]||[];const lines=st.filter(stroke=>stroke.length>=2);if(lines.length<2)return feedback('Начерти хотя бы два отрезка и подпиши их. Рисовать можно мышкой или пальцем.');if(a.drawGreater===undefined||a.drawGreater==='')return feedback('Выбери, чей отрезок должен быть длиннее.');if(Number(a.drawGreater)!==t.greater)return feedback('Проверь: большой отрезок обозначает большее количество. Кто получил больше?');state.phase=2;save();render()}
function correctSolve(){const t=TASKS[state.idx],a=ans(t);if(!a.sign||String(a.result||'').trim()==='')return feedback('Глитч ждёт! Сначала выбери знак и запиши число в ответе.');if(a.sign!==t.op)return feedback('Знак пока неверный. Проверь по чертежу: известно большее или меньшее число? А может, ищем разницу?');if(Number(a.result)!==t.answer)return feedback('Действие выбрано верно! Осталось внимательно пересчитать.');if(!state.done.includes(t.id))state.done.push(t.id);state.phase=3;save();render()}
function checkpoint(){const t=TASKS[state.idx];talk('Вот это да! Вы нашли ещё один сигнал. Но следующая ловушка хитрее!');let body='<div class="eyebrow">Сигнал восстановлен</div><div class="award">✦ 🛡️ ✦</div><h1>Ловушка '+safe(t.id)+' обезврежена!</h1><p class="lead">Чертёж помог понять смысл условия, а действие выбрано верно.</p><div class="story">✅ '+safe(t.given)+' '+safe(t.op)+' '+safe(t.unknown===-1?t.delta:t.delta)+' = <b>'+safe(t.answer)+'</b><br>Найдено сигналов: <b>'+state.done.length+' из 5</b>.</div>';if(state.idx===1)body+='<div class="recap"><h3>🔍 Сравни две задачи про грибы</h3><p><b>12.1:</b> 15 + 4 = 19. Бабушка нашла больше Леры.</p><p><b>12.2:</b> 15 − 4 = 11. Больше нашла Лера.</p><p>Числа те же, но сравниваются разные количества!</p></div>';if(state.idx===3)body+='<div class="recap"><h3>🔍 Сравни две задачи про флажки</h3><p><b>13.1:</b> 13 − 6 = 7. Алина вырезала меньше Вики.</p><p><b>13.2:</b> 13 + 6 = 19. Алина вырезала больше Вики.</p><p>Подсказка детектива: сначала определяй, у кого больше!</p></div>';body+='<div class="actions"><button class="btn" data-action="continue">'+(state.idx===4?'Получить удостоверение агента 🏅':'Следующее расследование →')+'</button></div>';main.innerHTML=body}
function finish(){talk('Не может быть! Вы раскрыли все пять моих ловушек! Я ещё вернусь…');setMap();main.innerHTML='<div class="eyebrow">Финал расследования</div><div class="award">🏆 ✨ 🛡️</div><h1>Глитч отступает!</h1><p class="lead">Все пять ловушек с прямыми, косвенными задачами и вопросом «на сколько больше» раскрыты.</p><div class="stamp"><div class="mini">АГЕНТСТВО ПОТЕРЯННЫХ ФАКТОВ</div><div class="award" style="font-size:2.5rem">🔎</div><div class="big">СПЕЦАГЕНТ<br>СРАВНЕНИЙ</div><p>'+safe(state.name.trim()||'Юный детектив')+'</p><div class="mini">Расшифровано 5 из 5 сигналов</div></div><div class="recap"><h3>Секрет против Глитча</h3><p>Не выбирай действие только по словам «больше» и «меньше». Сначала выясни, у кого действительно больше, нарисуй чертёж, затем решай.</p></div><div class="actions"><button class="btn" data-action="reset">Пройти расследование снова ↺</button><button class="btn alt" data-action="print">Распечатать награду</button></div>'}
function setupDraw(t){const canvas=$('#draw');if(!canvas)return;const ctx=canvas.getContext('2d');const strokes=state.ink[t.id]||(state.ink[t.id]=[]);function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#6954c2';ctx.lineWidth=5.5;ctx.lineCap='round';ctx.lineJoin='round';strokes.forEach(points=>{if(!points.length)return;ctx.beginPath();ctx.moveTo(points[0][0]*canvas.width,points[0][1]*canvas.height);points.slice(1).forEach(p=>ctx.lineTo(p[0]*canvas.width,p[1]*canvas.height));ctx.stroke()})}redraw();let active=false;function point(e){const r=canvas.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]}canvas.addEventListener('pointerdown',e=>{e.preventDefault();active=true;canvas.setPointerCapture(e.pointerId);strokes.push([point(e)]);redraw()});canvas.addEventListener('pointermove',e=>{if(!active)return;e.preventDefault();strokes[strokes.length-1].push(point(e));redraw()});const up=()=>{if(active){active=false;save()}};canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);canvas._redraw=redraw}
function hint(){const t=TASKS[state.idx];let m=state.phase===0?'Найди известное количество и число, показывающее разницу. В косвенной задаче слово «это» относится к тому, о чём сказано перед ним.':state.phase===1?'Нарисуй два отрезка и подпиши оба. Более длинный означает большее количество. Дополнительная часть показывает разницу.':'Если известно меньшее, а ищем большее — прибавляем. Если известно большее, а ищем меньшее — вычитаем. Чтобы узнать «на сколько», вычитаем.';if(t.id==='14'&&state.phase===0)m='В условии даны два известных числа: количество ложек и количество вилок. Сравни их.';$('#hint-zone').innerHTML='<div class="hint">💡 '+safe(m)+'</div>'}
function read(){const t=TASKS[state.idx];if(!('speechSynthesis' in window)){feedback('На этом устройстве озвучка браузера недоступна.');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.text);u.lang='ru-RU';u.rate=.88;window.speechSynthesis.speak(u)}
main.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;const t=TASKS[state.idx];if(action==='begin'){state.name=($('#agentName')||{}).value||'';state.started=true;save();render()}else if(action==='checkshort')correctShort();else if(action==='checkdraw')correctDraw();else if(action==='checksolve')correctSolve();else if(action==='continue'){state.idx++;state.phase=0;save();render();scrollTo({top:0,behavior:'smooth'})}else if(action==='hint')hint();else if(action==='read')read();else if(action==='undo'||action==='clear'){const s=state.ink[t.id]||[];if(action==='undo')s.pop();else s.length=0;save();const c=$('#draw');if(c&&c._redraw)c._redraw()}else if(action==='reset'){if(confirm('Начать расследование заново? Все результаты и чертежи будут очищены.')){state={started:false,idx:0,phase:0,done:[],a:{},ink:{},name:''};save();render()}}else if(action==='print')window.print()});
render();
})();
</script>
<style media="print">body{background:#fff}.top,.map,.side,.actions,.footer,.note{display:none!important}.board{display:block;margin:0}.main{box-shadow:none;border:0}.shell{padding:0}.panel{border:0}.stamp{break-inside:avoid}</style>
</body></html>
