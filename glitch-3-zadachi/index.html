<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профессор Глитч — 4 задачи</title>
<style>
:root{--bg:#0c1227;--card:#17213c;--line:#36456b;--cyan:#44e6ed;--pink:#ff6ab9;--yellow:#ffdf72;--white:#f5f7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#21365a 0,transparent 38%),var(--bg);color:var(--white);font:18px/1.5 system-ui,Arial,sans-serif;min-height:100vh}main{max-width:890px;margin:auto;padding:20px 16px 70px}header{text-align:center;padding:14px 0 12px}.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:.15em;font-size:13px}h1{font-size:clamp(30px,6vw,49px);margin:4px 0;text-shadow:3px 2px 0 #b83d96}h2{font-size:24px;margin:0 0 12px}header p{margin:6px 0 12px;color:#c0cde3}.track{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:16px 0}.node{border:1px solid var(--line);background:#202d4c;color:#c7d5e7;padding:9px 13px;border-radius:12px;font-weight:800}.node.on{color:#10162c;background:var(--cyan)}.node.done{background:#1c604e;color:#e7fff3}.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,32px);box-shadow:0 18px 42px #0004}.mission{display:inline-block;color:var(--yellow);font-size:14px;letter-spacing:.07em;font-weight:800;margin-bottom:8px}.story{background:#101932;border-left:4px solid var(--cyan);padding:17px 18px;border-radius:10px;font-size:clamp(19px,3vw,23px);line-height:1.65;margin:14px 0 22px;white-space:pre-line}.mini{color:#b7c8e4;font-size:16px}fieldset{border:0;margin:18px 0 0;padding:0}legend{font-weight:800;margin-bottom:12px;font-size:19px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.choice{border:2px solid #425479;border-radius:13px;padding:12px;background:#253350;color:white;font:inherit;font-weight:700;cursor:pointer;text-align:left;min-height:58px}.choice.selected{border-color:var(--cyan);background:#134954}.choice:hover{border-color:var(--pink)}.formulas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.formulas label{display:block;border:1px solid #475a7b;border-radius:12px;padding:12px;background:#202e4b}.formulas span{display:block;color:#d8e4f2;font-size:16px;margin-bottom:8px}.formulas input{width:100%;border:2px solid #7483a3;background:#0d1832;color:#fff;border-radius:10px;padding:10px 12px;font-size:23px;outline:none}.formulas input:focus{border-color:var(--cyan)}.unit{color:var(--yellow);font-size:14px;margin-top:6px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}button.action{border:0;background:var(--cyan);color:#0c1730;padding:13px 22px;border-radius:12px;font-weight:900;font-size:17px;cursor:pointer}button.secondary{background:#344364;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:18px;min-height:27px;font-weight:800}.feedback.good{color:#7affc2}.feedback.bad{color:#ffb5d2}.help{color:#bacbe5;font-size:15px;margin-top:12px}.win{text-align:center;padding:30px 10px}.win .trophy{font-size:70px}footer{text-align:center;color:#9caccb;font-size:13px;margin-top:22px}@media(max-width:520px){.choices{grid-template-columns:1fr}.story{font-size:19px}.panel{padding:17px}}
.workstep{border:1px solid #475a7b;border-radius:12px;padding:14px;background:#202e4b}.workstep strong{display:block;margin-bottom:10px;color:#ffdf72}.workstep select,.workstep input{width:100%;min-width:0;border:2px solid #7483a3;background:#0d1832;color:#fff;border-radius:10px;padding:11px;font:inherit;margin-bottom:10px}.workstep select{font-size:16px;white-space:normal}.workstep input{font-size:23px}.workstep select:focus,.workstep input:focus{border-color:#44e6ed}.choices{grid-template-columns:1fr}.choice{font-weight:600} </style></head><body><main><header><div class="eyebrow">МАТЕМАТИЧЕСКОЕ АГЕНТСТВО · 3 КЛАСС</div><h1>⚡ ПРОФЕССОР ГЛИТЧ</h1><p>Операция «Четыре сбоя» · реши задачи и восстанови систему</p><div class="track" id="track"></div></header><section class="panel" id="content"></section><footer>Читай условие внимательно. Сначала найди смысл подсказки, затем вычисляй.</footer></main>
<script>
const tasks=[
{tag:"Сбой 01 · Две лестницы",text:"На одной лестнице 36 ступенек. Это в 4 раза больше, чем ступенек на другой лестнице. Сколько всего ступенек на этих двух лестницах?",prompt:"Что означает сравнение в условии?",options:["36 ступенек — в 4 раза больше, чем на другой лестнице. Значит, на другой — в 4 раза меньше.","На другой лестнице в 4 раза больше 36 ступенек.","На другой лестнице на 4 ступеньки меньше."],correct:0,find:["Ступеньки на другой лестнице","Ступеньки на двух лестницах","Разницу между лестницами"],answers:[9,45],units:"ступенек",hint:"Обрати внимание на слово «Это»: оно относится к 36 ступенькам. 36 — больше. Значит, неизвестное количество — меньше."},
{tag:"Сбой 02 · Запасы корма",text:"Купили 30 кг сухого корма для собаки и кошки. Через месяц осталось 12 кг корма для собаки и 7 кг корма для кошки. Сколько килограммов сухого корма съели собака и кошка за месяц?",prompt:"Как правильно понять сведения об остатках?",options:["12 кг и 7 кг — это два остатка. Сначала узнаём общий остаток, потом — сколько съели.","12 кг и 7 кг — это столько корма съели.","Чтобы узнать, сколько съели, нужно сложить 30, 12 и 7."],correct:0,find:["Сколько корма осталось вместе","Сколько корма съели за месяц","Сколько корма купили","Сколько корма осталось у собаки"],answers:[19,11],units:"кг",hint:"Корм уже разделён на два остатка. Найди весь оставшийся корм, затем вычти его из купленного."},
{tag:"Сбой 03 · Две стройки",text:"Строители работали на одной стройке 9 дней. Это в 7 раз меньше времени, на протяжении которого они работали на другой стройке. Сколько дней работали строители на этих двух стройках?",prompt:"Как правильно понять косвенное сравнение?",options:["9 дней — в 7 раз меньше, чем на другой стройке. Значит, на другой стройке работали в 7 раз больше.","На другой стройке работали в 7 раз меньше 9 дней.","На другой стройке работали на 7 дней больше."],correct:0,find:["Дни на другой стройке","Дни на двух стройках","На сколько дней дольше работали на другой стройке"],answers:[63,72],units:"дней",hint:"«Это в 7 раз меньше» сказано про 9 дней. Поэтому неизвестное время на другой стройке — больше!"},
{tag:"Сбой 04 · Дежурные",text:"В 3 «Б» классе дежурные вымыли 5 парт. Это в 2 раза меньше, чем им осталось вымыть. Сколько всего парт в классе?",prompt:"Как правильно понять косвенное сравнение?",options:["5 парт вымыли — это в 2 раза меньше, чем осталось. Значит, осталось в 2 раза больше.","Осталось вымыть в 2 раза меньше, чем 5 парт.","Осталось вымыть на 2 парты больше."],correct:0,find:["Сколько парт осталось вымыть","Сколько всего парт в классе","На сколько парт осталось больше","Сколько парт уже вымыли"],answers:[10,15],units:"парт",hint:"«Это в 2 раза меньше» относится к пяти уже вымытым партам, а не к оставшимся."}
];
let n=0,chosen=null,passed=Array(tasks.length).fill(false);
const $=id=>document.getElementById(id);
function render(){
const t=tasks[n];chosen=null;
$("track").innerHTML=tasks.map((x,i)=>'<span class="node '+(passed[i]?'done':i===n?'on':'')+'">'+(passed[i]?'✓':'0'+(i+1))+'</span>').join('');
$("content").innerHTML='<div class="mission">'+t.tag.toUpperCase()+'</div><h2>🔍 Расшифруй условие</h2><div class="story">'+t.text+'</div><fieldset><legend>1. Как ты понимаешь условие?</legend><div class="choices" id="choices"></div></fieldset><fieldset><legend>2. Составь план и выполни действия</legend><p class="mini">Выбери, что находишь каждым действием. Готового плана нет!</p><div class="formulas">'+[0,1].map(i=>'<div class="workstep"><strong>'+(i+1)+'-е действие</strong><select id="s'+i+'" aria-label="Что находишь '+(i+1)+'-м действием"><option value="">— Что узнаем? —</option>'+t.find.map((s,k)=>'<option value="'+k+'">'+s+'</option>').join('')+'</select><input inputmode="numeric" type="number" id="a'+i+'" placeholder="Впиши ответ числом" aria-label="Ответ '+(i+1)+'-го действия"><div class="unit">'+t.units+'</div></div>').join('')+'</div></fieldset><div class="actions"><button class="action" id="check">⚡ Проверить</button><button class="action secondary" id="hint">💡 Подсказка</button></div><div class="feedback" id="msg" role="status"></div><p class="help" id="helper" hidden></p>';
t.options.forEach((choice,i)=>{const b=document.createElement('button');b.className='choice';b.type='button';b.textContent=choice;b.onclick=()=>{chosen=i;document.querySelectorAll('.choice').forEach(v=>v.classList.remove('selected'));b.classList.add('selected')};$("choices").appendChild(b)});
$("check").onclick=check;$("hint").onclick=()=>{$("helper").hidden=false;$("helper").textContent=t.hint};
}
function check(){
const t=tasks[n],a=[0,1].map(i=>$("a"+i).value.trim()),s=[0,1].map(i=>$("s"+i).value),msg=$("msg");
msg.className="feedback bad";
if(chosen===null||a.some(x=>x==="")||s.some(x=>x==="")){msg.textContent="Выбери смысл условия, план каждого действия и впиши оба ответа.";return}
if(chosen!==t.correct){msg.textContent="Сбой в понимании условия! Посмотри, к какому количеству относится сравнение.";return}
if(s[0]!=="0"||s[1]!=="1"){msg.textContent="Сбой в плане! Подумай, что нужно узнать сначала, а что — потом.";return}
const wrong=a.findIndex((v,i)=>Number(v)!==t.answers[i]);
if(wrong!==-1){msg.textContent="План правильный, но ошибка в вычислении № "+(wrong+1)+". Проверь число.";return}
passed[n]=true;msg.className="feedback good";msg.textContent="✅ Сбой устранён! Смысл, план и оба ответа верные.";
document.querySelectorAll(".choice,select,input").forEach(b=>b.disabled=true);$("check").disabled=true;
const next=document.createElement("button");next.className="action";next.textContent=n===tasks.length-1?"🏆 Завершить миссию":"Следующая станция →";next.onclick=()=>{if(n===tasks.length-1)victory();else{n++;render()}};document.querySelector(".actions").prepend(next);$("track").children[n].classList.add("done")
}
function victory(){$("track").innerHTML=tasks.map((_,i)=>'<span class="node done">✓ 0'+(i+1)+'</span>').join('');$("content").innerHTML='<div class="win"><div class="trophy">🏆</div><h2>МИССИЯ ВЫПОЛНЕНА!</h2><p>Профессор Глитч побеждён! Все четыре задачи решены верно.</p><button class="action" id="again">Пройти ещё раз ↻</button></div>';$("again").onclick=()=>{n=0;passed=Array(tasks.length).fill(false);render()}}
render();
</script></body></html>
