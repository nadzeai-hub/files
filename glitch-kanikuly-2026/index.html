function checkAnswer(){let q=DATA[state.current],ok=false,empty=false;if(q.kind==='fields'||q.kind==='pairs'){let vs=q.items.map((x,j)=>$('#f'+j).value);empty=vs.some(v=>!v.trim());ok=vs.every((v,j)=>norm(v)===norm(q.items[j].answer))}else if(q.kind==='order'){empty=sequence.length!==q.options.length;ok=JSON.stringify(sequence)===JSON.stringify(q.answer)}else{empty=!selected.length;ok=JSON.stringify([...selected].sort((a,b)=>a-b))===JSON.stringify(q.kind==='multi'?[...q.answer].sort((a,b)=>a-b):[q.answer])}if(empty){$('#feedback').innerHTML='<div class="feedback">Заполните все поля или завершите выбор, затем проверяйте.</div>';return}if(ok){solved=true;if(!state.done.includes(state.current))state.done.push(state.current);save();sound(true);$('#feedback').innerHTML=`<div class="feedback good"><b>✓ Ловушка обезврежена!</b> ${esc(q.why)}</div>`;$('#check').textContent='Дальше →';document.querySelectorAll('#answerui input,#answerui select,#answerui button').forEach(f=>f.disabled=true);document.querySelectorAll('.pip')[state.current%6]?.classList.add('done')}else{sound(false);$('#feedback').innerHTML=`<div class="feedback"><b>Глитч оставил подмену.</b> Перечитайте условие и попробуйте ещё раз. ${esc(q.hint)}</div>`;}$('#feedback').scrollIntoView({block:'nearest',behavior:'smooth'})}

function reward(s){if(count(s)!==6){openStation(s);return}let x=STATIONS[s];screen='reward';app.innerHTML=`<section class="reward"><div class="eyebrow">РАЙОН ${s+1} ВОССТАНОВЛЕН</div><div style="width:130px;margin:auto">${robot(true,true)}</div><h1>${x.name}<br><span style="color:${x.color}">снова работает!</span></h1><p style="font-size:21px">Команда получила кристалл и часть финального кода.</p><div class="lettercards"><div class="letter" style="background:${x.pale}"><small style="display:block;font-size:13px;color:${x.color}">МЕСТО ${x.code}</small>${x.letter}</div></div><p class="muted">Сохраните букву и её номер. Они понадобятся в центре города.</p><div class="startactions" style="justify-content:center"><button class="primary" id="rewardnext">${s===5?'Открыть главный пульт →':s===2&&!state.reboot?'Перезагрузка команды →':'В следующий район →'}</button><button class="secondary" id="rewardmap">Карта города</button></div></section>`;$('#rewardmap').onclick=renderMap;$('#rewardnext').onclick=()=>{if(s===5)renderFinal();else if(s===2&&!state.reboot)renderPause();else openStation(s+1)};confetti(22);}
function renderPause(){screen='pause';app.innerHTML=`<section class="reward pausepanel"><div class="eyebrow">СЮЖЕТНАЯ ПАУЗА · 2 МИНУТЫ</div><h1>Перезагрузка<br>без проводов.</h1><p style="font-size:20px">Глитч перегрел пульт. Встаньте и передайте сигналы движением!</p><div class="pausemoves"><div class="move"><span>↟</span><b>Гласный — вверх</b><br>Ведущий называет звуки. Гласный — руки вверх, согласный — руки на пояс.</div><div class="move"><span>↔</span><b>Больше или меньше?</b><br>Число больше 10 — руки широко; меньше 10 — ладони вместе. Ровно 10 — замрите.</div><div class="move"><span>☀</span><b>Паглядзі ўдалечыню</b><br>Знайдзі вачыма тры прадметы ў пакоі. Назаві іх. Павольна пацягніся.</div></div><p class="note">Не спешите. Секундомер можно поставить на паузу кнопкой сверху.</p><button class="primary" id="pausenext">Команда готова →</button></section>`;$('#pausenext').onclick=()=>{state.reboot=true;save();openStation(3)}}

function renderVictory(){screen='victory';app.innerHTML=`<section class="reward"><div class="eyebrow">МИССИЯ ВЫПОЛНЕНА</div><h1>Победа команды.<br><span style="color:var(--purple)">Город снова сияет!</span></h1><div class="artboard" style="max-width:650px;min-height:300px;margin:25px auto">${city()}</div><p style="font-size:21px">«Ладно, вы меня переиграли! Я понял: одного быстрого ответа мало — нужно ещё объяснить, почему он верный».</p><div class="tags" style="justify-content:center"><span class="tag">✓ 36 испытаний</span><span class="tag">◆ 6 кристаллов</span><span class="tag">♥ Одна команда</span></div><h3>Три вопроса напоследок</h3><p style="line-height:1.7">Какая ловушка была самой хитрой?<br>Какое правило помогло её раскрыть?<br>Что вы посоветуете Глитчу проверить в следующий раз?</p><button class="primary" id="victorymap">Вернуться в спасённый город</button></section>`;$('#victorymap').onclick=renderMap;}

#a9e7ec"/><text x="510" y="58" fill="#1b8396">ВМЕСТИМОСТЬ · л</text></g>';else content='<g fill="#ede7ff" stroke="#9c7be2" stroke-width="2">'+[0,1,2,3,4,5,6,7].map((_,i)=>`<rect x="${145+i*55}" y="22" width="43" height="50" rx="9" fill="${i<5?'#bd9ef4':'#eae2fc'}"/>`).join('')+'</g><path d="M98 45h22m-11-11v22M608 45h25" stroke="#ed83b4" stroke-width="5"/>';return `<div class="questionart"><svg viewBox="0 0 750 94" aria-hidden="true">${content}</svg></div>`}
function modal(html){$('#overlay').innerHTML=`<div class="modalbg"><section class="modal" role="dialog" aria-modal="true" aria-label="Информационное окно"><div class="modalheader"><span class="eyebrow">КАНИКУЛЫ ПОД КОДОМ</span><button class="quiet" id="closemodal" aria-label="Закрыть">✕</button></div>${html}</section></div>`;$('#closemodal').onclick=closeModal;$('#closemodal').focus()}function closeModal(){$('#overlay').innerHTML='';$('#teacher').focus()}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#closemodal'))closeModal()});
function resetModal(){modal('<h2>Начать новое приключение?</h2><p>Прогресс этого квеста на этом устройстве будет сброшен. Остальные игры это не затронет.</p><button class="primary" id="confirmreset">Да, начать заново</button>');$('#confirmreset').onclick=()=>{state={done:[],current:0,started:false,elapsed:0,paused:false,reboot:false,final:false,sound:state.sound};save();closeModal();renderMap()}}
function teacher(){modal(`<h2>Панель педагога</h2><p>Единое занятие для сильной группы 2 класса. Игра рассчитана на <b>совместное обсуждение</b>: дети читают, предлагают решение и объясняют его, педагог или назначенный оператор вводит ответ. Один маршрут для всех.</p><table><thead><tr><th>Этап</th><th>Минуты</th><th>Как провести</th></tr></thead><tbody><tr><td>Вход в сюжет</td><td>3</td><td>Прочитать вызов Глитча, договориться объяснять ответы.</td></tr><tr><td>Районы 1–3</td><td>21</td><td>По 7 минут на район, около минуты на испытание с обсуждением.</td></tr><tr><td>Перезагрузка</td><td>2</td><td>Встать, выполнить три сигнала без экрана.</td></tr><tr><td>Районы 4–6</td><td>21</td><td>Чередовать отвечающих. Просить назвать правило или показать ход решения.</td></tr><tr><td>Код и обсуждение ловушек</td><td>8</td><td>Собрать слово по номерам. Вспомнить по одной ловушке каждого предмета.</td></tr><tr><td>Рефлексия</td><td>5</td><td>Каждый называет трудную ловушку и правило, которое помогло.</td></tr></tbody></table><p class="note">Итого 60 минут — ориентир для работы с обсуждением. Игра не заканчивается автоматически по таймеру. Секундомер учитывает время открытой страницы после старта; его можно приостановить.</p><details><summary>Источники и границы тем</summary><div class="answer"><p>Основные источники: загруженные учебники 2025 года. Задания авторские, составлены по изученным темам; страницы из учебников не копировались в интерфейс.</p><b>Математика, Муравьёва / Урбан, ч. 1, с. 6–82:</b> числа до 20; сложение и вычитание, компоненты, перестановка слагаемых и обратные действия; переход через десяток; простые, косвенные задачи и разностное сравнение; неизвестный компонент; см/дм, кг, л; ломаная; десятки до 100, образование и разрядный состав двузначного числа.<p><b>Русский язык, ч. 1, с. 4–94:</b> вводное сопоставление русских и белорусских звуков и написаний; звуки и буквы, алфавит, гласные/согласные, е/ё/ю/я; слоги и перенос; твёрдость/мягкость, мягкий знак как показатель мягкости и разделительный ъ; жи–ши, же–ше; твёрдый [ц]; ча–ща, чу–щу. Ударение используется в рамках чтения и сравнения слов. Правописание чк/чн, парных согласных и разделительного ь как отдельные темы не проверяются.</p><p><b>Беларуская мова, Свірыдзенка, ч. 1, па пр. 186, с. 93:</b> уступны курс; і, г/г’, ч, ў, ц’, р, дз’, дж; апостраф; гукі і літары; алфавіт; вялікая літара; галосныя/зычныя; у/ў. Таксама школьная лексіка, ветлівыя словы, гародніна/садавіна, разуменне кароткага тэксту. Тэму складаў, якая пачынаецца на с. 93 з пр. 187, не ўключалі.</p></div></details><details><summary>Все ответы и объяснения — открыть для проверки</summary>${DATA.map((q,i)=>`<details><summary>${i+1}. ${esc(q.title)} · ${q.sub}</summary><div class="answer">${esc(q.why)}<br><i>${esc(q.hint)}</i></div></details>`).join('')}</details><details><summary>Финальный код и управление</summary><div class="answer">Районы дают: 5–Д, 1–П, 6–А, 2–О, 4–Е, 3–Б. По номерам получается ПОБЕДА. Повторные попытки не ограничены. Пройденные испытания доступны через карту и кнопку «Назад». Следующий район открывается после всех шести заданий предыдущего. Прогресс хранится только в браузере этого устройства. Для онлайн-занятия показывайте игру через демонстрацию экрана. Звуки короткие, без озвучки; по умолчанию выключены. Текстовая подсказка доступна в каждом задании.</div></details><button class="linkbtn" id="teacherreset" style="margin-top:16px">Начать заново на этом устройстве</button>`);$('#teacherreset').onclick=resetModal;}
let audioCtx;function sound(ok){if(!state.sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();[ok?520:220,ok?780:180].forEach((f,j)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=f;g.gain.setValueAtTime(.04,audioCtx.currentTime+j*.13);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+j*.13+.15);o.start(audioCtx.currentTime+j*.13);o.stop(audioCtx.currentTime+j*.13+.16)})}catch(e){}}
function confetti(n){let box=document.createElement('div');box.className='confetti';box.setAttribute('aria-hidden','true');box.innerHTML=Array.from({length:n},(_,i)=>`<i style="left:${Math.random()*100}%;background:${['#f77fae','#9364ee','#26c9d0','#d1ed6b','#ffc85d'][i%5]};animation-delay:${Math.random()*.6}s;transform:rotate(${Math.random()*180}deg)"></i>`).join('');document.body.append(box);setTimeout(()=>box.remove(),3900)}
