<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Лаборатория формул · 5 класс</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4f7;color:#23344a;font:20px/1.5 system-ui,Arial,sans-serif}main{max-width:920px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:16px;margin-bottom:18px}h1{font-size:clamp(27px,4vw,38px);line-height:1.15;margin:0;color:#163c50}h2{font-size:25px;margin:0 0 14px}p{margin:0 0 15px}.muted{color:#4e6474;font-size:18px}.clippy{width:80px;flex:0 0 80px;height:90px}.panel{border:1px solid #d4e3e9;background:white;border-radius:24px;padding:clamp(17px,4vw,32px);box-shadow:0 8px 24px #12394d0d}.track{height:12px;border-radius:9px;background:#dbe6eb;overflow:hidden;margin:10px 0 18px}.track div{height:100%;background:#218a89;transition:width .2s}.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 22px}.stage{border:1px solid #ccdde4;border-radius:12px;padding:9px;font-size:17px;background:#f8fbfc;color:#4e6474}.stage.active{border:2px solid #228785;background:#e2f4ef;color:#175e5b;font-weight:700}.stage.done{background:#e6f1f5}.chip{font-size:17px;color:#236a72;font-weight:700;letter-spacing:.03em}.prompt{font-size:23px;font-weight:650;line-height:1.45;margin:10px 0 20px}.expression{font-size:clamp(22px,5vw,33px);font-weight:650;background:#eaf4f6;border-radius:13px;padding:15px;text-align:center;overflow-wrap:anywhere;margin-bottom:20px}fieldset{border:0;padding:0;margin:0 0 18px;min-width:0}legend,label.fieldname{font-weight:650;display:block;margin:0 0 9px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:9px}.choice{display:flex;align-items:center;gap:10px;min-height:56px;border:1px solid #c7d8df;border-radius:12px;padding:10px 14px;cursor:pointer;background:#f8fbfd;overflow-wrap:anywhere}.choice:has(input:checked){border:2px solid #197b82;background:#e5f4f5;padding:9px 13px}.choice input{width:20px;height:20px;accent-color:#197b82;flex:none}input[type=text]{font:inherit;width:min(100%,300px);padding:10px 14px;border:1px solid #9ab7c6;border-radius:10px;background:#fbfdfe}input:disabled{opacity:1;color:#324653}button{font:inherit;font-weight:650;border:0;border-radius:12px;padding:12px 20px;background:#176d75;color:white;cursor:pointer;min-height:50px}button.secondary{background:#e6eef1;color:#234657}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #d68b24;outline-offset:3px}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.feedback{border-radius:13px;padding:15px 18px;margin-top:18px;background:#fff4df;color:#573d15}.feedback.ok{background:#e2f3e8;color:#235d3b}.stats{display:grid;gap:10px;margin:18px 0}.stat{background:#f0f6f8;border-radius:12px;padding:12px 15px;display:flex;justify-content:space-between;gap:10px}.review{border-top:1px solid #dce6eb;padding:13px 0}.review p{margin:3px 0}.footer{margin-top:17px;text-align:center;font-size:16px;color:#526c7c}@media(max-width:520px){main{padding:12px}.stages{gap:5px}.stage{font-size:15px;padding:7px}.clippy{width:60px;flex-basis:60px;height:75px}.prompt{font-size:21px}}
</style></head><body><main><header><svg class="clippy" viewBox="0 0 95 110" aria-label="Скрепка" role="img"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M32 55V19C32 2 65 2 65 24v59c0 29-43 29-43 0V36c0-17 23-18 23 0v43" stroke="#4f6272" stroke-width="9"/><path d="M32 55V19C32 2 65 2 65 24v59c0 29-43 29-43 0V36c0-17 23-18 23 0v43" stroke="#c6d2da" stroke-width="5"/></g><ellipse cx="35" cy="29" rx="13" ry="16" fill="#fff" stroke="#40586a" stroke-width="2"/><ellipse cx="60" cy="29" rx="13" ry="16" fill="#fff" stroke="#40586a" stroke-width="2"/><circle cx="39" cy="31" r="5" fill="#273849"/><circle cx="56" cy="31" r="5" fill="#273849"/><path d="M23 10q10-7 20-1m8 0q11-7 21 1" fill="none" stroke="#273849" stroke-width="4" stroke-linecap="round"/></svg><div><h1>Лаборатория формул</h1><div class="muted">Математика · 5 класс · Проверка знаний</div></div></header><div id="app"></div><div class="footer">Территория репетиторства · Математическая лаборатория</div></main><script>
"use strict";
const DATA=[{"section":0,"prompt":"Как найти путь при постоянной скорости?","fields":[{"label":"Формула","answer":"s = v · t","choices":["s = v · t","s = v : t","s = t : v","s = v + t"]}],"why":"Путь равен произведению скорости и времени.","expr":""},{"section":0,"prompt":"Восстанови две формулы.","fields":[{"label":"Скорость","answer":"v = s : t","choices":["v = s : t","v = s · t","v = t : s"]},{"label":"Время","answer":"t = s : v","choices":["t = s : v","t = v : s","t = s · v"]}],"why":"Из s = v · t получаем v = s : t и t = s : v.","expr":""},{"section":0,"prompt":"Прямоугольник имеет стороны a и b. Выбери формулы.","fields":[{"label":"Периметр","answer":"P = 2 · (a + b)","choices":["P = 2 · (a + b)","P = a · b","P = a + b","P = 2 · a + b"]},{"label":"Площадь","answer":"S = a · b","choices":["S = a · b","S = 2 · (a + b)","S = a + b","S = a · a"]}],"why":"Периметр — сумма длин всех сторон, площадь — произведение длины и ширины.","expr":""},{"section":0,"prompt":"У квадрата сторона a. Восстанови формулы.","fields":[{"label":"Периметр","answer":"P = 4 · a","choices":["P = 4 · a","P = a²","P = 2 · a"]},{"label":"Площадь","answer":"S = a²","choices":["S = a²","S = 4 · a","S = 2 · a"]}],"why":"У квадрата четыре равные стороны, а площадь равна a · a.","expr":""},{"section":0,"prompt":"vс — собственная скорость катера, vт — скорость течения. Как найти скорости движения по реке?","fields":[{"label":"По течению","answer":"vс + vт","choices":["vс + vт","vс − vт","vс · vт"]},{"label":"Против течения","answer":"vс − vт","choices":["vс − vт","vс + vт","vт − vс"]}],"why":"Течение помогает при движении по течению и мешает при движении против течения.","expr":""},{"section":0,"prompt":"Два велосипедиста едут навстречу друг другу. Какова скорость сближения?","fields":[{"label":"Скорость сближения","answer":"v₁ + v₂","choices":["v₁ + v₂","v₁ − v₂ (v₁ > v₂)","v₁ · v₂"]}],"why":"При встречном движении скорости складывают.","expr":""},{"section":0,"prompt":"Два лыжника движутся из одной точки в противоположных направлениях. Какова скорость удаления?","fields":[{"label":"Скорость удаления","answer":"v₁ + v₂","choices":["v₁ + v₂","v₁ − v₂ (v₁ > v₂)","v₁ · v₂"]}],"why":"При движении в противоположных направлениях расстояние растёт со скоростью, равной сумме скоростей.","expr":""},{"section":0,"prompt":"Два велосипедиста едут в одном направлении. Быстрый находится позади медленного (v₁ > v₂). Как найти скорость сближения?","fields":[{"label":"Скорость сближения","answer":"v₁ − v₂","choices":["v₁ − v₂","v₁ + v₂","v₁ · v₂"]}],"why":"При движении вдогонку скорость сближения равна разности скоростей.","expr":""},{"section":1,"prompt":"Робот-доставщик проехал 84 км за 4 ч с постоянной скоростью. Найди его скорость.","fields":[{"label":"Выбери выражение","answer":"84 : 4","choices":["84 : 4","84 · 4","84 − 4","4 : 84"]},{"label":"Скорость, км/ч","answer":"21"}],"why":"v = s : t = 84 : 4 = 21 км/ч.","expr":""},{"section":1,"prompt":"Для выставки сделали прямоугольную рамку длиной 45 см и шириной 3 дм. Сколько сантиметров ленты нужно на её периметр?","fields":[{"label":"Выбери выражение","answer":"2 · (45 + 30)","choices":["2 · (45 + 30)","2 · (45 + 3)","45 · 30","45 + 30"]},{"label":"Длина ленты, см","answer":"150"}],"why":"3 дм = 30 см. P = 2 · (45 + 30) = 150 см.","expr":""},{"section":1,"prompt":"Периметр квадратной площадки — 48 м. Найди её площадь.","fields":[{"label":"Выбери выражение","answer":"(48 : 4)²","choices":["(48 : 4)²","48 · 4","48²","(48 : 2)²"]},{"label":"Площадь, м²","answer":"144"}],"why":"Сторона 48 : 4 = 12 м. S = 12² = 144 м².","expr":""},{"section":1,"prompt":"Собственная скорость катера 18 км/ч, скорость течения 3 км/ч. Сколько километров пройдёт катер против течения за 4 ч?","fields":[{"label":"Выбери выражение","answer":"(18 − 3) · 4","choices":["(18 − 3) · 4","(18 + 3) · 4","18 · 4 − 3","(18 − 3) : 4"]},{"label":"Путь, км","answer":"60"}],"why":"Скорость против течения 18 − 3 = 15 км/ч. Путь 15 · 4 = 60 км.","expr":""},{"section":1,"prompt":"Моторная лодка с собственной скоростью 16 км/ч движется по течению реки со скоростью течения 4 км/ч. За сколько часов она пройдёт 100 км?","fields":[{"label":"Выбери выражение","answer":"100 : (16 + 4)","choices":["100 : (16 + 4)","100 : (16 − 4)","100 : 16 + 4","100 · (16 + 4)"]},{"label":"Время, ч","answer":"5"}],"why":"Скорость по течению 16 + 4 = 20 км/ч. Время 100 : 20 = 5 ч.","expr":""},{"section":1,"prompt":"Катер идёт по течению со скоростью 24 км/ч, против течения — 18 км/ч. Найди скорость течения и собственную скорость.","fields":[{"label":"Первое действие для скорости течения","answer":"(24 − 18) : 2","choices":["(24 − 18) : 2","24 − 18","(24 + 18) : 2","24 + 18"]},{"label":"Скорость течения, км/ч","answer":"3"},{"label":"Собственная скорость, км/ч","answer":"21"}],"why":"Разность скоростей равна удвоенной скорости течения: (24 − 18) : 2 = 3 км/ч. Собственная скорость 24 − 3 = 21 км/ч.","expr":""},{"section":1,"prompt":"Между станциями 360 км. Одновременно навстречу друг другу выехали два поезда и встретились через 3 ч. Скорость первого — 55 км/ч. Найди скорость второго.","fields":[{"label":"Выбери выражение","answer":"360 : 3 − 55","choices":["360 : 3 − 55","360 : 3 + 55","(360 − 55) : 3","360 − 55 · 3"]},{"label":"Скорость второго, км/ч","answer":"65"}],"why":"Скорость сближения 360 : 3 = 120 км/ч. Скорость второго 120 − 55 = 65 км/ч.","expr":""},{"section":1,"prompt":"Из парка одновременно в противоположных направлениях отправились два велосипедиста со скоростями 12 и 15 км/ч. Какое расстояние будет между ними через 3 ч?","fields":[{"label":"Выбери выражение","answer":"(12 + 15) · 3","choices":["(12 + 15) · 3","(15 − 12) · 3","12 + 15 · 3","(12 + 15) : 3"]},{"label":"Расстояние, км","answer":"81"}],"why":"Скорость удаления 12 + 15 = 27 км/ч. Расстояние 27 · 3 = 81 км.","expr":""},{"section":1,"prompt":"Велосипедист находится в 24 км позади другого. Оба едут в одном направлении со скоростями 18 и 12 км/ч соответственно. Через сколько часов первый догонит второго?","fields":[{"label":"Выбери выражение","answer":"24 : (18 − 12)","choices":["24 : (18 − 12)","24 : (18 + 12)","(18 − 12) · 24","24 : 18"]},{"label":"Время, ч","answer":"4"}],"why":"Скорость сближения 18 − 12 = 6 км/ч. Время 24 : 6 = 4 ч.","expr":""},{"section":2,"prompt":"Раскрой скобки. Заполни коэффициенты и свободное слагаемое.","fields":[{"label":"Коэффициент перед x","answer":"6"},{"label":"Число после знака +","answer":"24"}],"why":"6(x + 4) = 6x + 24. Умножаем каждое слагаемое на 6.","expr":"6(x + 4) = □x + □"},{"section":2,"prompt":"Раскрой скобки. Заполни оба коэффициента.","fields":[{"label":"Коэффициент перед a","answer":"15"},{"label":"Коэффициент перед b","answer":"10"}],"why":"5(3a − 2b) = 15a − 10b.","expr":"5(3a − 2b) = □a − □b"},{"section":2,"prompt":"Упрости выражение: раскрой скобки и приведи подобные слагаемые.","fields":[{"label":"Коэффициент перед y","answer":"17"},{"label":"Число после знака +","answer":"12"}],"why":"4(3y + 3) + 5y = 12y + 12 + 5y = 17y + 12.","expr":"4(3y + 3) + 5y = □y + □"},{"section":2,"prompt":"Упрости выражение до одного слагаемого с переменной.","fields":[{"label":"Коэффициент перед m","answer":"13"}],"why":"19m − 6m = (19 − 6)m = 13m.","expr":"19m − 6m = □m"},{"section":2,"prompt":"Вынеси за скобки наибольший общий числовой множитель.","fields":[{"label":"Множитель перед скобками","answer":"6"},{"label":"Коэффициент перед a","answer":"3"},{"label":"Коэффициент перед b","answer":"2"}],"why":"18a + 12b = 6(3a + 2b).","expr":"18a + 12b = □(□a + □b)"},{"section":2,"prompt":"Вынеси за скобки наибольший общий числовой множитель.","fields":[{"label":"Множитель перед скобками","answer":"7"},{"label":"Коэффициент перед x","answer":"5"},{"label":"Число после знака −","answer":"3"}],"why":"35x − 21 = 7(5x − 3).","expr":"35x − 21 = □(□x − □)"},{"section":2,"prompt":"Вынеси за скобки наибольший общий числовой множитель вместе с x.","fields":[{"label":"Число перед x","answer":"4"},{"label":"Коэффициент перед a","answer":"3"},{"label":"Коэффициент перед b","answer":"2"}],"why":"12ax + 8bx = 4x(3a + 2b).","expr":"12ax + 8bx = □x(□a + □b)"}];
const NAMES=["01 · Знаю формулы","02 · Решаю задачи","03 · Преобразую выражения"];
const KEY="formula-lab-2026-11-27-v1";
const app=document.getElementById("app");
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function fresh(){return {i:0,results:[],orders:DATA.map(q=>q.fields.map(f=>f.choices?shuffle(f.choices):null))}}
let state;try{state=JSON.parse(localStorage.getItem(KEY));if(!state||!Array.isArray(state.results)||!Array.isArray(state.orders)||state.orders.length!==DATA.length||!Number.isInteger(state.i)||state.i<0||state.i>DATA.length||state.results.length<state.i||state.results.length>state.i+1)state=fresh()}catch(e){state=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function add(parent,tag,cls,txt){const n=el(tag,cls,txt);parent.append(n);return n}
function button(parent,txt,fn,secondary=false){const b=add(parent,"button",secondary?"secondary":"",txt);b.type="button";b.addEventListener("click",fn);return b}
function same(f,x){if(f.choices)return x===f.answer;return /^\d+$/.test(x.trim())&&Number(x.trim())===Number(f.answer)}
function restart(){if(!confirm("Начать новую проверку? Текущий результат будет сброшен."))return;state=fresh();save();render()}
function render(){app.replaceChildren();const done=state.results.length;const correct=state.results.filter(r=>r.ok).length;
if(state.i>=DATA.length){const panel=add(app,"section","panel");add(panel,"h2","","Проверка завершена!");add(panel,"p","prompt",correct+" из "+DATA.length+" заданий полностью верно");const stats=add(panel,"div","stats");NAMES.forEach((name,s)=>{const ids=DATA.map((q,i)=>q.section===s?i:-1).filter(i=>i>=0);const n=ids.filter(i=>state.results[i].ok).length;const row=add(stats,"div","stat");add(row,"span","",name);add(row,"strong","",n+" / "+ids.length)});add(panel,"p","muted","Покажи этот экран преподавателю. Если есть ошибки, посмотри разбор ниже.");const errors=DATA.map((q,i)=>({q,i,r:state.results[i]})).filter(x=>!x.r.ok);if(errors.length){add(panel,"h2","","Что повторить");errors.forEach(({q,i,r})=>{const row=add(panel,"div","review");add(row,"strong","",(i+1)+". "+q.prompt);if(q.expr)add(row,"p","",q.expr);q.fields.forEach((f,j)=>{if(!r.flags[j])add(row,"p","muted",f.label+": твой ответ — "+r.values[j]+"; верно — "+f.answer)});add(row,"p","",q.why)})}else add(panel,"p","","Все три блока выполнены без ошибок.");button(add(panel,"div","buttons"),"Начать заново",restart,true);return}
const q=DATA[state.i],record=state.results[state.i];add(app,"div","muted","Задание "+(state.i+1)+" из "+DATA.length+" · Проверено: "+done+" · Верно: "+correct);const track=add(app,"div","track");add(track,"div").style.width=(done/DATA.length*100)+"%";const stages=add(app,"div","stages");NAMES.forEach((n,i)=>add(stages,"div","stage "+(i===q.section?"active":i<q.section?"done":""),n));const panel=add(app,"section","panel");add(panel,"div","chip",NAMES[q.section]);add(panel,"p","prompt",q.prompt);if(state.i===0&&!record)add(panel,"p","muted","Скрепка: на каждое задание — одна попытка. После проверки увидишь объяснение. Можно пользоваться черновиком.");if(q.expr)add(panel,"div","expression",q.expr);const form=add(panel,"form");const getters=[];const controls=[];q.fields.forEach((f,j)=>{const fs=add(form,"fieldset");add(fs,"legend","",f.label);if(f.choices){const group=add(fs,"div","choices");const order=state.orders[state.i][j];order.forEach((choice,k)=>{const lab=add(group,"label","choice");const input=add(lab,"input");input.type="radio";input.name="f"+j;input.value=choice;input.required=true;input.checked=!!record&&record.values[j]===choice;input.disabled=!!record;controls.push(input);add(lab,"span","",choice)});getters.push(()=>{const a=form.querySelector('input[name="f'+j+'"]:checked');return a?a.value:""})}else{const input=add(fs,"input");input.type="text";input.inputMode="numeric";input.pattern="[0-9]+";input.required=true;input.maxLength=8;input.placeholder="Введи число";input.setAttribute("aria-label",f.label);input.disabled=!!record;if(record)input.value=record.values[j];controls.push(input);getters.push(()=>input.value.trim())}});const buttons=add(form,"div","buttons");if(!record){const check=add(buttons,"button","","Проверить");check.type="submit";check.disabled=true;function update(){check.disabled=!getters.every((g,j)=>q.fields[j].choices?g()!=="":/^\d+$/.test(g()))}form.addEventListener("input",update);form.addEventListener("change",update);form.addEventListener("submit",e=>{e.preventDefault();if(state.results[state.i])return;const values=getters.map(g=>g());if(!values.every((x,j)=>q.fields[j].choices?x!=="":/^\d+$/.test(x)))return;const flags=q.fields.map((f,j)=>same(f,values[j]));state.results.push({values,flags,ok:flags.every(Boolean)});save();render();document.getElementById("feedback").focus()})}else{const feedback=add(panel,"div","feedback "+(record.ok?"ok":""));feedback.id="feedback";feedback.tabIndex=-1;feedback.setAttribute("role","status");add(feedback,"strong","",record.ok?"Верно!":"Есть ошибка.");if(!record.ok)q.fields.forEach((f,j)=>{if(!record.flags[j])add(feedback,"div","",f.label+": "+f.answer)});add(feedback,"div","",q.why);button(buttons,state.i===DATA.length-1?"Посмотреть результат":"Следующее задание →",()=>{state.i++;save();render();window.scrollTo(0,0)})}}
save();render();
</script></body></html>
